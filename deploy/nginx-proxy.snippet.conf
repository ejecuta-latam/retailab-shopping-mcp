# One-time paste into the nginx-proxy container config on the VM
# (/home/admin/nginx/nginx.conf), then:
#   docker exec nginx-proxy nginx -t && docker exec nginx-proxy nginx -s reload
#
# Also add a DNS A record for shopping.realslab.xyz to the VM, and expand the
# Let's Encrypt SAN (cert currently lives at /etc/letsencrypt/live/realslab.xyz/).

server {
  listen 443 ssl http2;
  server_name shopping.realslab.xyz;

  ssl_certificate     /etc/letsencrypt/live/realslab.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/realslab.xyz/privkey.pem;

  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    set $upstream http://retailab-shopping-mcp:80;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
