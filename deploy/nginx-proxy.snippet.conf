# Paste into /home/admin/nginx/nginx.conf on the VM (inside the http { } block), then:
#   docker exec nginx-proxy nginx -t && docker exec nginx-proxy nginx -s reload
#
# DNS A: shopping.ejecuta.lat → the VM (already configured).
# Certs: docker certbot webroot against /home/admin/certbot/www.

    server {
        listen 80;
        server_name shopping.ejecuta.lat;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name shopping.ejecuta.lat;
        ssl_certificate /etc/letsencrypt/live/shopping.ejecuta.lat/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/shopping.ejecuta.lat/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        resolver 127.0.0.11 valid=10s ipv6=off;
        location / {
            set $upstream http://retailab-shopping-mcp:80;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
